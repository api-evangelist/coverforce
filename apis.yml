apis:
- name: CoverForce API
  description: >-
    Unified commercial insurance API connecting to 40+ carriers and MGAs through a single integration.
    Documented endpoint families include Applications (create and submit in a unified JSON schema),
    Quotes (retrieve comparable multi-carrier quotes), Bind (request bindable terms), Document AI
    (extract and populate application data from uploaded documents), Renewals, Appetite (query carrier
    eligibility dynamically), Status (real-time application/quote status), Analytics, and Documents.
    Access to the developer portal and sandbox is granted on request.
